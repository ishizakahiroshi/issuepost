# issuepost の設定の雛形。**ここに出てくる値はすべて例で、実値は 1 つも入っていない。**
#
# 実ファイルは鍵とパスワードを持つので追跡しない。雛形だけをリポジトリへ置く。
# 知らないキーがあると起動しない。綴りを間違えたときに、黙って既定値で動き出さないため。
# 書き換えたら再起動が要る。設定は起動時に 1 回だけ読む。
#
# **業務固有の語（種別・状態・承認状態）はコードに 1 つも入っていない。**
# 下の values を書き換えれば、その組織の語がそのまま台帳の値になる。
# 保存されるのは識別子で、画面に出す言葉ではない（設計文書 §2）。

# 待ち受けアドレス。前段に逆プロキシを置くので 127.0.0.1 に閉じる。
# 0.0.0.0 にすると、ホストのネットワークに面した口が 1 つ増える。
listen = "127.0.0.1:8090"


# --- 台帳のデータベース -------------------------------------------------------
#
# 台帳は自分のデータベースを持つ。隣のサービスに間借りしない（設計文書 §7）。
# ホストの外へポートを出さない。台帳からだけ届く経路に置く。
#
# 日時はすべて UTC で保存する。接続のタイムゾーンは受け口が自分で UTC に固定するので、
# ここには書かない（設定の書き方で「期限を過ぎた」の境界がずれないようにするため）。

[database]
host     = "127.0.0.1"
port     = 3306
name     = "issuepost"
user     = "issuepost"
# 実値はここへ直接書かず、運用者の秘密管理から取り出して置く。
# この設定ファイルは、その他のユーザーから読めない権限（0640）にする。
password = "replace-me"
# 張る接続の上限。隣のサービスと同じマシンに載るので、接続数も自分で決める。
max_open_conns = 10


# --- 呼び出し元アプリ ---------------------------------------------------------
#
# 1 アプリにつき [[apps]] を 1 つ書く。
# どのアプリとして扱うかは、リクエスト本文ではなくここの name から決まる。
# 本文に書かせると、どのアプリでも他のアプリの接頭辞で採番できてしまう。

[[apps]]
name = "app_one"
# 有効な鍵。2 本まで書ける。1 本だと入れ替えの日にそのアプリが止まる。
#   1. 新しい鍵をここへ足して再起動する（この時点で新旧どちらでも通る）
#   2. 呼ぶ側を落ち着いて新しい鍵へ書き換える
#   3. 古い鍵をここから消して再起動する
# 値は `openssl rand -base64 32`（44 文字）。32 文字未満は起動時に弾く。
keys = ["replace-me-with-openssl-rand-base64-32--"]
# このアプリが名乗れる環境名。案件の place.environment はここに無い値を受けない。
envs = ["production", "staging"]
# 呼び出し元として許す IP。単独の IP と CIDR のどちらも書ける。
# 前段に逆プロキシを置く構成では、ここに書くのはその逆プロキシ。
# 空にすると起動しない。空を「全許可」と読ませないため。
allow_ips = ["127.0.0.1"]

[[apps]]
name      = "app_two"
keys      = ["replace-me-with-another-random-string---"]
envs      = ["production"]
allow_ips = ["203.0.113.0/24"]

[[apps]]
# 横断で見る画面のための合言葉。運営側のみ。
# 範囲が "*" なので、この合言葉では案件を入れられない（下記 [[scopes]] を参照）。
name      = "operator_console"
keys      = ["replace-me-with-a-third-random-string---"]
envs      = ["production"]
allow_ips = ["127.0.0.1"]


# --- 合言葉ごとに見える範囲 ---------------------------------------------------
#
# 4 本のアプリの案件が 1 つの表に入る。あるアプリの画面が、別のアプリや別の顧客の
# 案件を触れないことを、受け口が保証する（設計文書 §4）。
# **呼ぶ側の画面が絞ってくれることを当てにしない。**
#
# source と tenant は必ず配列で書く。「全部」は ["*"]。片方を文字列、片方を配列に
# すると、読む実装が 2 通りになる。"*" は他の値と混ぜて書けない。
#
# **案件を入れられるのは source が具体的な 1 つに固定された合言葉だけ。**
# これが、知らない接頭辞で勝手に採番されない理由そのもの。
# app ごとに 1 つ必要で、書き忘れると起動しない（無い＝全部見える、と読まない）。

[[scopes]]
app    = "app_one"
source = ["app_one"]
tenant = ["tenant_a"]

[[scopes]]
app    = "app_two"
source = ["app_two"]
# 顧客で分かれていないアプリ。案件の tenant_ref は空になる。
tenant = ["*"]

[[scopes]]
app    = "operator_console"
source = ["*"]
tenant = ["*"]


# --- 言葉の定義 ---------------------------------------------------------------
#
# 以下はサンプルであって、誰かが採用しなければならない既定値ではない。
# 組織が別の語を使うなら識別子ごと差し替えてよい。
# 差し替えてよくないのは「識別子と表示名を混ぜること」のほう。

[kinds]
values = ["bug", "request", "question", "note"]
# 承認を通してから開発へ流す種別。ここに無い種別は承認不要で入る。
requires_approval = ["request"]

[statuses]
# 1 セットだけ。全アプリ・全画面がこれを使う。
values   = ["new", "investigated", "in_progress", "done", "wont_do"]
open     = ["new", "investigated", "in_progress"]
terminal = ["done", "wont_do"]
# 受け口が新しい案件に入れる値。open のどれかでなければ起動しない。
initial  = "new"
# 「誰待ちか」を出すための対応。状態は進み具合で、誰待ちとは別の軸なので設定で持つ。
waiting  = { new = "us", investigated = "them", in_progress = "us", done = "none", wont_do = "none" }

[approval_states]
values = ["not_required", "pending", "approved", "rejected", "on_hold"]
# 承認が要る種別の初期値と、要らない種別の初期値。受け口がこれを入れる。
initial      = "pending"
initial_free = "not_required"
# 「保留」を表す値。保留の解除期限（hold_until）を持てるのはこの状態のときだけ。
# どの語が保留かをコードに書かないので、ここで名指しする。
hold         = "on_hold"


# --- 添付の置き場 -------------------------------------------------------------
#
# **台帳は実体を持たない。**参照とメタだけを持ち、バイト列は外のファイル置き場
# （WebDAV）へ置く。**この節を書かなければ、添付の口だけが動かない。**
# 置き場が決まっていない間も案件は受け付けられる（添付が入らないことを理由に
# 案件を落とすほうが損失が大きい・設計文書 §6）。
#
# 書くなら、上限 2 本も書く。上限の無い受け口と上限の無い置き場を作らない。

# [attachments]
# base_url = "https://files.example.com/issuepost"
# user     = "issuepost"
# # 実値はここへ直接書かず、運用者の秘密管理から取り出して置く。
# password = "replace-me"
# # 1 回の置き・消しの待ち時間（秒）。0 なら 30 秒。
# timeout_seconds = 30
# # 1 件の上限。超えたものは切らずに拒否する。
# max_file_bytes = 26214400
# # 置き場ぜんたいの上限。**当たったら受け付けない**（古いものから押し出さない）。
# total_limit_bytes = 53687091200
